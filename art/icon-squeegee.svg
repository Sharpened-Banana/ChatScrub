    <rect x="300" y="300" width="30" height="170" rx="15" transform="rotate(-40 315 300)" fill="#e0a35a" stroke="#4a2a0c" stroke-width="9"/>
    <rect x="270" y="56" width="44" height="270" rx="12" fill="#3a8fd0" stroke="#0d2f4a" stroke-width="10"/>
    <rect x="262" y="56" width="16" height="270" rx="8" fill="#1b1b1b" stroke="#0d0d0d" stroke-width="4"/>
