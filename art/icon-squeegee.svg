  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="20"/>

  <path d="M140 76 H372 A60 60 0 0 1 432 136 V276 A60 60 0 0 1 372 336 H214 L132 408 L150 336 H140 A60 60 0 0 1 80 276 V136 A60 60 0 0 1 140 76 Z"
