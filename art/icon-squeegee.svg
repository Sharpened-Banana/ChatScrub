  <!-- dirty left half: red-tinted spam text; clean right half -->
  <g clip-path="url(#bubbleClip)">
    <rect x="70" y="60" width="380" height="360" fill="#c9d3cf"/>
    <rect x="290" y="60" width="160" height="360" fill="url(#bubble)"/>
    <g fill="#8a2d2d">
